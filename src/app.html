<!doctype html>
<html lang="en" data-theme="light" data-era="now">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f7c2b" />
		<script>
			// Set theme and era before first paint to avoid a flash.
			try {
				var d = document.documentElement;
				var t = localStorage.getItem('theme');
				if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				d.dataset.theme = t;
				if (localStorage.getItem('y2k') === '1') d.dataset.era = 'y2k';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
